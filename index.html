    <!--
      Theme bootstrap — runs before React mounts (and before first paint in
      practice) so the correct `data-theme` attribute is already present when
      CSS custom properties are resolved. Without this, a client-rendered
      theme toggle would cause a flash of the default theme on every load.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('hk-theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
